services:
  iam-audit-cli:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iam-audit-cli
    environment:
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_PROFILE=${AWS_PROFILE:-default}
    volumes:
      - ~/.aws:/home/auditor/.aws:ro
      - ./reports:/app/reports
      - ./output:/app/output
    command: ["demo"]

  iam-audit-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iam-audit-api
    ports:
      - "8000:8000"
    environment:
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - IAM_AUDIT_API_KEY=${IAM_AUDIT_API_KEY:-devkey}
    volumes:
      - ~/.aws:/home/auditor/.aws:ro
    entrypoint: ["python", "-m", "uvicorn", "iam_audit.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    profiles:
      - api