name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Lint with ruff
        run: |
          ruff check aws/ iam_audit/ tests/
          ruff format --check aws/ iam_audit/ tests/

      - name: Type check with mypy
        run: mypy iam_audit/ aws/

      - name: Test with pytest
        run: pytest --cov=iam_audit --cov=aws --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t iam-audit:latest .

      - name: Test Docker image
        run: |
          docker run --rm iam-audit:latest python -c "import iam_audit; print(iam_audit.__version__)"
          docker run --rm iam-audit:latest iam-audit --help
